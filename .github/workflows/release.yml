# Build the mod archive when a version tag is pushed, attach it to a GitHub
# Release, and hand it to Nexus.
#
# The package is built by tools/New-ModPackage.ps1 - the same script run
# locally - rather than by a second copy of the packing rules living in YAML.
# If the zip is wrong it is wrong in one place.
#
# ON THE NEXUS STEP
#
# Nexus Mods has no first-party publishing API: their public API reads mod data
# and manages endorsements, and there is no supported endpoint for uploading a
# file to a mod page. Every "upload to Nexus" action is a community project
# driving the website with stored credentials.
#
# So this workflow does NOT upload. It produces the artefact, names it exactly
# as the mod page wants it, and prints the two facts needed to publish. The last
# step is a browser and thirty seconds, and in exchange no third-party action
# ever holds a Nexus session cookie. If Nexus ships a real upload API this is
# the place to wire it.

name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A package that installs to the wrong place is worse than no package, so
      # the builder asserts its own zip roots and this fails if it complains.
      - name: Build package
        shell: pwsh
        run: |
          $v = "${{ github.ref_name }}" -replace '^v', ''
          if ($v -notmatch '^\d+\.\d+\.\d+$') { $v = '0.0.0-dev' }
          .\tools\New-ModPackage.ps1 -Version $v

      - name: Verify the archive installs where a manager expects
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = Get-ChildItem build\*.zip | Select-Object -First 1
          $z = [System.IO.Compression.ZipFile]::OpenRead($zip.FullName)
          try {
            $names = $z.Entries.FullName
            # These four are the whole mod. If any is missing the zip installs
            # cleanly and the mod does nothing, which is the failure mode that
            # wastes a player's evening and looks like a bug in the game.
            foreach ($need in @(
              'r6/scripts/NetSec/Breach.reds',
              'r6/tweaks/NetSec/netsec_daemon.yaml',
              'archive/pc/mod/netsec_loc.archive',
              'archive/pc/mod/netsec_access_points.archive')) {
              if ($names -notcontains $need) { throw "package is missing $need" }
            }
            Write-Host "ok: $($z.Entries.Count) entries, all required paths present"
          } finally { $z.Dispose() }

      - uses: actions/upload-artifact@v4
        with:
          name: netsec-package
          path: build/*.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/*.zip
          generate_release_notes: true

      # Everything a Nexus upload needs, in one place, so publishing is a paste
      # rather than a hunt.
      - name: Nexus upload checklist
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $zip = Get-ChildItem build\*.zip | Select-Object -First 1
          $v   = "${{ github.ref_name }}" -replace '^v', ''
          Write-Host ""
          Write-Host "NEXUS UPLOAD"
          Write-Host "  file          : $($zip.Name)  ($([math]::Round($zip.Length/1KB)) KB)"
          Write-Host "  version       : $v"
          Write-Host "  download from : ${{ github.server_url }}/${{ github.repository }}/releases/tag/${{ github.ref_name }}"
          Write-Host ""
          Write-Host "  Nexus has no upload API - this step is deliberately manual."
